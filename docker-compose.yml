services:
  api:
    build: .
    command: ["node", "-r", "tsconfig-paths/register", "dist/app.js"]
    ports:
      - "9999:9999"
    env_file:
      - .env
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/SwakipOS-erp
      REDIS_CACHE_LIVE: redis://redis:6379
      REDIS_CACHE_BULLMQ: redis://redis:6379
    depends_on:
      - mongo
      - redis
    restart: unless-stopped

  worker:
    build: .
    command: ["node", "-r", "tsconfig-paths/register", "dist/MessageQueue/index.js"]
    env_file:
      - .env
    environment:
      NODE_ENV: production
      MONGODB_URI: mongodb://mongo:27017/SwakipOS-erp
      REDIS_CACHE_LIVE: redis://redis:6379
      REDIS_CACHE_BULLMQ: redis://redis:6379
    depends_on:
      - mongo
      - redis
    restart: unless-stopped

  mongo:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    restart: unless-stopped

volumes:
  mongo-data:
  redis-data:
